<svg viewBox="0 0 1300 920" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:'Segoe UI',sans-serif">
<defs>
  <marker id="ab" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#42a5f5"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#66bb6a"/></marker>
  <marker id="ao" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ffa726"/></marker>
  <marker id="ar" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
  <marker id="ap" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ab47bc"/></marker>
  <marker id="ay" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#78909c"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Title -->
<text x="650" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Smart Lighting — Automation State Machine</text>
<text x="650" y="52" text-anchor="middle" fill="#484f58" font-size="11">Click detection via dvbit/whodidit · HA entity parameter names shown</text>

<!-- IDLE -->
<circle cx="140" cy="420" r="68" fill="#0d1117" stroke="#1f6feb" stroke-width="2.5" filter="url(#glow)"/>
<text x="140" y="410" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">IDLE</text>
<text x="140" y="428" text-anchor="middle" fill="#6e7681" font-size="11">💡 OFF</text>
<text x="140" y="444" text-anchor="middle" fill="#6e7681" font-size="10">no timers</text>

<!-- ACTIVE -->
<circle cx="480" cy="360" r="78" fill="#0d2a0d" stroke="#2ea043" stroke-width="3" filter="url(#glow2)"/>
<text x="480" y="340" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">ACTIVE</text>
<text x="480" y="360" text-anchor="middle" fill="#a8dba8" font-size="11">💡 ON @ brightness</text>
<text x="480" y="377" text-anchor="middle" fill="#6e7681" font-size="10">occupancy_timeout</text>
<text x="480" y="392" text-anchor="middle" fill="#6e7681" font-size="10">failsafe_timeout</text>

<!-- WARNING -->
<circle cx="480" cy="600" r="62" fill="#2d1600" stroke="#f0883e" stroke-width="2.5" filter="url(#glow)"/>
<text x="480" y="585" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="700">WARNING</text>
<text x="480" y="603" text-anchor="middle" fill="#ffb673" font-size="10">💡 dim to</text>
<text x="480" y="619" text-anchor="middle" fill="#ffb673" font-size="10">warning_dim_pct %</text>

<!-- TEMP OVERRIDE -->
<circle cx="800" cy="220" r="72" fill="#21063a" stroke="#a371f7" stroke-width="2.5" filter="url(#glow)"/>
<text x="800" y="200" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="700">TEMP</text>
<text x="800" y="218" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="700">OVERRIDE</text>
<text x="800" y="238" text-anchor="middle" fill="#8b73c8" font-size="10">💡 toggled (manual)</text>
<text x="800" y="254" text-anchor="middle" fill="#6e7681" font-size="9">click restarts timer</text>

<!-- PERM OVERRIDE -->
<circle cx="800" cy="600" r="72" fill="#3a0000" stroke="#f85149" stroke-width="2.5" filter="url(#glow)"/>
<text x="800" y="580" text-anchor="middle" fill="#ffa198" font-size="13" font-weight="700">PERM</text>
<text x="800" y="598" text-anchor="middle" fill="#ffa198" font-size="13" font-weight="700">OVERRIDE</text>
<text x="800" y="618" text-anchor="middle" fill="#ef9a9a" font-size="10">💡 toggled</text>
<text x="800" y="634" text-anchor="middle" fill="#6e7681" font-size="9">perm_override_timeout</text>

<!-- SUSPENDED -->
<circle cx="1120" cy="420" r="64" fill="#161b22" stroke="#484f58" stroke-width="2"/>
<text x="1120" y="405" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700">SUSPENDED</text>
<text x="1120" y="423" text-anchor="middle" fill="#484f58" font-size="10">light frozen</text>
<text x="1120" y="439" text-anchor="middle" fill="#484f58" font-size="10">all events ignored</text>

<!-- ① IDLE → ACTIVE -->
<path d="M208 400 Q320 330 402 355" stroke="#66bb6a" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
<rect x="222" y="322" width="148" height="44" rx="6" fill="#0d2a0d" stroke="#2ea043" stroke-width="1"/>
<text x="296" y="338" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="700">motion ON</text>
<text x="296" y="352" text-anchor="middle" fill="#8b949e" font-size="9">+ lux &lt; lux_threshold</text>
<text x="296" y="364" text-anchor="middle" fill="#6e7681" font-size="9">→ brightness_normal/soft</text>

<!-- ② ACTIVE → WARNING -->
<path d="M480 438 L480 538" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
<rect x="492" y="462" width="162" height="48" rx="6" fill="#2d1600" stroke="#f0883e" stroke-width="1"/>
<text x="573" y="479" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="700">occupancy_timeout</text>
<text x="573" y="493" text-anchor="middle" fill="#8b949e" font-size="9">from last motion</text>
<text x="573" y="507" text-anchor="middle" fill="#6e7681" font-size="9">(adaptive factor applied)</text>

<!-- ③ WARNING → IDLE -->
<path d="M425 628 C310 720 180 680 140 490" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#ao)"/>
<rect x="152" y="690" width="168" height="48" rx="6" fill="#2d1600" stroke="#f0883e" stroke-width="1"/>
<text x="236" y="706" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="700">warning_dim_duration</text>
<text x="236" y="720" text-anchor="middle" fill="#8b949e" font-size="9">→ light OFF</text>
<text x="236" y="733" text-anchor="middle" fill="#6e7681" font-size="9">(0 = immediate off)</text>

<!-- ④ WARNING → ACTIVE -->
<path d="M445 540 C400 490 400 440 402 440" stroke="#66bb6a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="292" y="470" width="142" height="36" rx="6" fill="#0d2a0d" stroke="#2ea043" stroke-width="1"/>
<text x="363" y="485" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="700">motion / occupancy ON</text>
<text x="363" y="499" text-anchor="middle" fill="#6e7681" font-size="9">restores brightness</text>

<!-- ⑤ ACTIVE → IDLE natural light -->
<path d="M415 295 C340 200 220 200 145 355" stroke="#42a5f5" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#ab)"/>
<rect x="175" y="168" width="205" height="54" rx="6" fill="#0c2033" stroke="#1f6feb" stroke-width="1"/>
<text x="277" y="184" text-anchor="middle" fill="#42a5f5" font-size="10" font-weight="700">🌤 natural light auto-off</text>
<text x="277" y="198" text-anchor="middle" fill="#8b949e" font-size="9">lux &gt; threshold×(1+lux_hysteresis_pct%)</text>
<text x="277" y="212" text-anchor="middle" fill="#6e7681" font-size="9">for lux_hysteresis_time s · normal profile only</text>

<!-- ⑥ ACTIVE → IDLE failsafe -->
<path d="M470 282 C470 100 160 80 145 355" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)"/>
<rect x="338" y="70" width="215" height="44" rx="6" fill="#3a0000" stroke="#f85149" stroke-width="1"/>
<text x="445" y="87" text-anchor="middle" fill="#f85149" font-size="10" font-weight="700">⚡ failsafe_timeout</text>
<text x="445" y="101" text-anchor="middle" fill="#8b949e" font-size="9">no motion · resets on every motion</text>
<text x="445" y="113" text-anchor="middle" fill="#6e7681" font-size="9">forces OFF incl. relay · immune in perm_override</text>

<!-- ⑦ no-motion fallback → WARNING -->
<path d="M403 370 C260 400 200 440 172 450" stroke="#78909c" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ao)"/>
<rect x="36" y="490" width="172" height="54" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
<text x="122" y="507" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="700">no_motion_timeout</text>
<text x="122" y="521" text-anchor="middle" fill="#6e7681" font-size="9">occupancy ON, no motion</text>
<text x="122" y="534" text-anchor="middle" fill="#6e7681" font-size="9">→ WARNING (0=disabled)</text>

<!-- ⑧ ACTIVE → TEMP OVERRIDE -->
<path d="M546 308 C620 240 700 220 728 220" stroke="#ab47bc" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>
<rect x="570" y="244" width="140" height="44" rx="6" fill="#21063a" stroke="#a371f7" stroke-width="1"/>
<text x="640" y="260" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="700">whodidit: 1 click</text>
<text x="640" y="274" text-anchor="middle" fill="#8b949e" font-size="9">click_count=1 · toggles light</text>
<text x="640" y="287" text-anchor="middle" fill="#6e7681" font-size="9">each click restarts timer</text>

<!-- ⑨ IDLE → TEMP OVERRIDE -->
<path d="M205 388 C380 300 580 240 728 224" stroke="#ab47bc" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ap)"/>

<!-- ⑩ TEMP OVERRIDE exit on timeout -->
<path d="M730 248 C660 300 590 330 558 345" stroke="#ab47bc" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="566" y="296" width="176" height="44" rx="6" fill="#0d2a0d" stroke="#a371f7" stroke-width="1"/>
<text x="654" y="312" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="700">temp_override_timeout</text>
<text x="654" y="326" text-anchor="middle" fill="#8b949e" font-size="9">→ re-evaluate presence</text>
<text x="654" y="339" text-anchor="middle" fill="#6e7681" font-size="9">(0 = stays indefinitely)</text>

<!-- ⑪ ACTIVE → PERM OVERRIDE -->
<path d="M546 408 C620 500 700 572 728 585" stroke="#f85149" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<rect x="568" y="468" width="140" height="36" rx="6" fill="#3a0000" stroke="#f85149" stroke-width="1"/>
<text x="638" y="483" text-anchor="middle" fill="#ffa198" font-size="10" font-weight="700">whodidit: 2 clicks</text>
<text x="638" y="497" text-anchor="middle" fill="#8b949e" font-size="9">click_count=2 · toggles light</text>

<!-- ⑫ IDLE → PERM OVERRIDE -->
<path d="M200 448 C380 520 580 576 728 596" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ar)"/>

<!-- ⑬ PERM OVERRIDE exit -->
<path d="M730 572 C660 510 590 450 558 420" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="558" y="512" width="172" height="44" rx="6" fill="#0d2a0d" stroke="#f85149" stroke-width="1"/>
<text x="644" y="528" text-anchor="middle" fill="#ffa198" font-size="10" font-weight="700">2 clicks or timeout</text>
<text x="644" y="542" text-anchor="middle" fill="#8b949e" font-size="9">→ re-evaluate presence</text>

<!-- ⑭ ANY → SUSPENDED -->
<path d="M558 380 C720 380 880 400 1056 408" stroke="#78909c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ay)"/>
<rect x="698" y="352" width="168" height="36" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
<text x="782" y="367" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="700">suspend_entity = ON</text>
<text x="782" y="381" text-anchor="middle" fill="#6e7681" font-size="9">cancel all timers · freeze light</text>

<!-- ⑮ SUSPENDED → re-evaluate -->
<path d="M1056 438 C900 480 720 468 558 430" stroke="#78909c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="698" y="446" width="168" height="36" rx="6" fill="#0d2a0d" stroke="#484f58" stroke-width="1"/>
<text x="782" y="461" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="700">suspend_entity = OFF</text>
<text x="782" y="475" text-anchor="middle" fill="#6e7681" font-size="9">re-evaluate motion + lux</text>

<!-- LEGEND -->
<rect x="20" y="800" width="1260" height="108" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="650" y="820" text-anchor="middle" fill="#6e7681" font-size="11" font-weight="700">LEGEND</text>
<line x1="40" y1="840" x2="76" y2="840" stroke="#66bb6a" stroke-width="2" marker-end="url(#ag)"/>
<text x="84" y="844" fill="#3fb950" font-size="11">Activate / Recover</text>
<line x1="220" y1="840" x2="256" y2="840" stroke="#f0883e" stroke-width="2" marker-end="url(#ao)"/>
<text x="264" y="844" fill="#f0883e" font-size="11">Warning dim → OFF</text>
<line x1="410" y1="840" x2="446" y2="840" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
<text x="454" y="844" fill="#f85149" font-size="11">Failsafe / Perm override</text>
<line x1="620" y1="840" x2="656" y2="840" stroke="#ab47bc" stroke-width="2" marker-end="url(#ap)"/>
<text x="664" y="844" fill="#d2a8ff" font-size="11">Temp override (whodidit)</text>
<line x1="840" y1="840" x2="876" y2="840" stroke="#42a5f5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
<text x="884" y="844" fill="#42a5f5" font-size="11">Natural light auto-off</text>
<line x1="1050" y1="840" x2="1086" y2="840" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ay)"/>
<text x="1094" y="844" fill="#8b949e" font-size="11">Suspend</text>
<text x="40" y="870" fill="#6e7681" font-size="10" font-weight="700">KEY PARAMS: </text>
<text x="120" y="870" fill="#8b949e" font-size="10">occupancy_timeout · failsafe_timeout · warning_dim_pct · warning_dim_duration · temp_override_timeout · perm_override_timeout</text>
<text x="40" y="886" fill="#6e7681" font-size="10" font-weight="700">                   </text>
<text x="120" y="886" fill="#8b949e" font-size="10">no_motion_timeout · lux_threshold · lux_hysteresis_pct · lux_hysteresis_time · adaptive_window · adaptive_threshold · adaptive_multiplier</text>
<text x="40" y="900" fill="#6e7681" font-size="10" font-weight="700">WHODIDIT: </text>
<text x="110" y="900" fill="#8b949e" font-size="10">binary_sensor ON→OFF · click_count attr: 1=temp_override (toggle+restart timer) · 2=perm_override (toggle, enter/exit) · 3+=ignored</text>
</svg>
