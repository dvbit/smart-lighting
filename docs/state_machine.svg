<svg viewBox="0 0 1300 940" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:'Segoe UI',sans-serif">
<defs>
  <marker id="ab" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#42a5f5"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#66bb6a"/></marker>
  <marker id="ao" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ffa726"/></marker>
  <marker id="ar" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
  <marker id="ap" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ab47bc"/></marker>
  <marker id="ay" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#78909c"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<text x="650" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Smart Lighting — Automation State Machine (v4.3)</text>
<text x="650" y="50" text-anchor="middle" fill="#484f58" font-size="11">Click detection via dvbit/whodidit · HA entity parameter names shown</text>

<!-- STATES -->
<circle cx="140" cy="430" r="68" fill="#0d1117" stroke="#1f6feb" stroke-width="2.5" filter="url(#glow)"/>
<text x="140" y="420" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">IDLE</text>
<text x="140" y="438" text-anchor="middle" fill="#6e7681" font-size="11">💡 OFF</text>
<text x="140" y="454" text-anchor="middle" fill="#6e7681" font-size="10">no timers</text>

<circle cx="480" cy="370" r="78" fill="#0d2a0d" stroke="#2ea043" stroke-width="3" filter="url(#glow2)"/>
<text x="480" y="350" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">ACTIVE</text>
<text x="480" y="370" text-anchor="middle" fill="#a8dba8" font-size="11">💡 ON @ brightness</text>
<text x="480" y="387" text-anchor="middle" fill="#6e7681" font-size="10">occupancy_timeout</text>
<text x="480" y="402" text-anchor="middle" fill="#6e7681" font-size="10">failsafe_timeout</text>

<circle cx="480" cy="620" r="62" fill="#2d1600" stroke="#f0883e" stroke-width="2.5" filter="url(#glow)"/>
<text x="480" y="605" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="700">WARNING</text>
<text x="480" y="623" text-anchor="middle" fill="#ffb673" font-size="10">💡 dim to</text>
<text x="480" y="639" text-anchor="middle" fill="#ffb673" font-size="10">warning_dim_pct %</text>

<circle cx="800" cy="230" r="72" fill="#21063a" stroke="#a371f7" stroke-width="2.5" filter="url(#glow)"/>
<text x="800" y="210" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="700">TEMP</text>
<text x="800" y="228" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="700">OVERRIDE</text>
<text x="800" y="248" text-anchor="middle" fill="#8b73c8" font-size="10">💡 toggled (manual)</text>
<text x="800" y="264" text-anchor="middle" fill="#6e7681" font-size="9">click restarts timer</text>

<circle cx="800" cy="620" r="72" fill="#3a0000" stroke="#f85149" stroke-width="2.5" filter="url(#glow)"/>
<text x="800" y="600" text-anchor="middle" fill="#ffa198" font-size="13" font-weight="700">PERM</text>
<text x="800" y="618" text-anchor="middle" fill="#ffa198" font-size="13" font-weight="700">OVERRIDE</text>
<text x="800" y="638" text-anchor="middle" fill="#ef9a9a" font-size="10">💡 toggled</text>
<text x="800" y="654" text-anchor="middle" fill="#6e7681" font-size="9">perm_override_timeout</text>

<circle cx="1120" cy="430" r="64" fill="#161b22" stroke="#484f58" stroke-width="2"/>
<text x="1120" y="415" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700">SUSPENDED</text>
<text x="1120" y="433" text-anchor="middle" fill="#484f58" font-size="10">light frozen</text>
<text x="1120" y="449" text-anchor="middle" fill="#484f58" font-size="10">all events ignored</text>

<!-- ① IDLE → ACTIVE -->
<path d="M208 410 Q320 340 402 365" stroke="#66bb6a" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
<rect x="216" y="322" width="168" height="54" rx="6" fill="#0d2a0d" stroke="#2ea043" stroke-width="1"/>
<text x="300" y="338" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="700">PRESENCE + lux OK</text>
<text x="300" y="352" text-anchor="middle" fill="#8b949e" font-size="9">motion ON (if motion sensors)</text>
<text x="300" y="364" text-anchor="middle" fill="#8b949e" font-size="9">occupancy ON (if no motion sensors)</text>
<text x="300" y="374" text-anchor="middle" fill="#6e7681" font-size="9">lux &lt; lux_threshold</text>

<!-- ② ACTIVE → WARNING -->
<path d="M480 448 L480 558" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
<rect x="492" y="472" width="176" height="60" rx="6" fill="#2d1600" stroke="#f0883e" stroke-width="1"/>
<text x="580" y="489" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="700">occupancy_timeout expired</text>
<text x="580" y="503" text-anchor="middle" fill="#8b949e" font-size="9">started by: occupancy OFF</text>
<text x="580" y="515" text-anchor="middle" fill="#8b949e" font-size="9">or motion OFF (if no occ. sensor)</text>
<text x="580" y="527" text-anchor="middle" fill="#6e7681" font-size="9">× adaptive factor applied</text>

<!-- ③ WARNING → IDLE -->
<path d="M425 648 C310 740 180 700 140 500" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#ao)"/>
<rect x="146" y="710" width="180" height="48" rx="6" fill="#2d1600" stroke="#f0883e" stroke-width="1"/>
<text x="236" y="726" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="700">warning_dim_duration</text>
<text x="236" y="740" text-anchor="middle" fill="#8b949e" font-size="9">elapsed → light OFF</text>
<text x="236" y="753" text-anchor="middle" fill="#6e7681" font-size="9">(0 = immediate off, no dim)</text>

<!-- ④ WARNING → ACTIVE -->
<path d="M445 560 C400 505 400 455 402 450" stroke="#66bb6a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="288" y="490" width="146" height="36" rx="6" fill="#0d2a0d" stroke="#2ea043" stroke-width="1"/>
<text x="361" y="505" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="700">motion / occupancy ON</text>
<text x="361" y="519" text-anchor="middle" fill="#6e7681" font-size="9">restores full brightness</text>

<!-- ⑤ ACTIVE → IDLE natural light -->
<path d="M415 305 C340 205 220 205 145 365" stroke="#42a5f5" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#ab)"/>
<rect x="168" y="170" width="215" height="54" rx="6" fill="#0c2033" stroke="#1f6feb" stroke-width="1"/>
<text x="275" y="186" text-anchor="middle" fill="#42a5f5" font-size="10" font-weight="700">🌤 natural light auto-off</text>
<text x="275" y="200" text-anchor="middle" fill="#8b949e" font-size="9">lux &gt; threshold×(1+lux_hysteresis_pct%)</text>
<text x="275" y="214" text-anchor="middle" fill="#6e7681" font-size="9">for lux_hysteresis_time s · normal profile only</text>

<!-- ⑥ ACTIVE → IDLE failsafe -->
<path d="M468 292 C468 100 155 82 140 362" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)"/>
<rect x="330" y="66" width="240" height="52" rx="6" fill="#3a0000" stroke="#f85149" stroke-width="1"/>
<text x="450" y="83" text-anchor="middle" fill="#f85149" font-size="10" font-weight="700">⚡ failsafe_timeout — STUCK SENSOR GUARD</text>
<text x="450" y="96" text-anchor="middle" fill="#8b949e" font-size="9">no motion for N seconds · resets on every motion</text>
<text x="450" y="108" text-anchor="middle" fill="#6e7681" font-size="9">forces OFF incl. relay · immune in PERM OVERRIDE</text>

<!-- ⑧ ACTIVE → TEMP OVERRIDE -->
<path d="M548 318 C625 255 705 232 728 230" stroke="#ab47bc" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>
<rect x="566" y="252" width="150" height="52" rx="6" fill="#21063a" stroke="#a371f7" stroke-width="1"/>
<text x="641" y="268" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="700">whodidit: 1 click</text>
<text x="641" y="281" text-anchor="middle" fill="#8b949e" font-size="9">click_count=1 · TOGGLES light</text>
<text x="641" y="294" text-anchor="middle" fill="#6e7681" font-size="9">every click toggles + restarts timer</text>

<!-- ⑨ IDLE → TEMP OVERRIDE -->
<path d="M205 396 C380 310 580 250 728 234" stroke="#ab47bc" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ap)"/>

<!-- ⑩ TEMP OVERRIDE exit (timeout only) -->
<path d="M732 262 C670 310 600 340 558 358" stroke="#ab47bc" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="562" y="312" width="184" height="52" rx="6" fill="#0d2a0d" stroke="#a371f7" stroke-width="1"/>
<text x="654" y="328" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="700">temp_override_timeout ONLY</text>
<text x="654" y="341" text-anchor="middle" fill="#8b949e" font-size="9">→ re-evaluate presence + lux</text>
<text x="654" y="354" text-anchor="middle" fill="#6e7681" font-size="9">(0 = never exits, user in control)</text>

<!-- ⑪ ACTIVE → PERM OVERRIDE -->
<path d="M548 425 C625 520 705 592 728 605" stroke="#f85149" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<rect x="565" y="488" width="150" height="36" rx="6" fill="#3a0000" stroke="#f85149" stroke-width="1"/>
<text x="640" y="503" text-anchor="middle" fill="#ffa198" font-size="10" font-weight="700">whodidit: 2 clicks</text>
<text x="640" y="517" text-anchor="middle" fill="#8b949e" font-size="9">click_count=2 · toggles light</text>

<!-- ⑫ IDLE → PERM OVERRIDE -->
<path d="M200 462 C380 540 580 596 728 614" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ar)"/>

<!-- ⑬ PERM OVERRIDE exit -->
<path d="M732 590 C665 528 592 462 558 432" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="552" y="532" width="180" height="48" rx="6" fill="#0d2a0d" stroke="#f85149" stroke-width="1"/>
<text x="642" y="548" text-anchor="middle" fill="#ffa198" font-size="10" font-weight="700">2 clicks again OR timeout</text>
<text x="642" y="562" text-anchor="middle" fill="#8b949e" font-size="9">→ re-evaluate presence + lux</text>
<text x="642" y="574" text-anchor="middle" fill="#6e7681" font-size="9">enter/exit toggle behaviour</text>

<!-- ⑭ ANY → SUSPENDED -->
<path d="M558 390 C720 390 880 410 1056 418" stroke="#78909c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ay)"/>
<rect x="700" y="362" width="168" height="36" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
<text x="784" y="377" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="700">suspend_entity = ON</text>
<text x="784" y="391" text-anchor="middle" fill="#6e7681" font-size="9">cancel all timers · freeze light</text>

<!-- ⑮ SUSPENDED → re-evaluate -->
<path d="M1056 448 C900 490 720 478 558 440" stroke="#78909c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ag)"/>
<rect x="700" y="456" width="168" height="36" rx="6" fill="#0d2a0d" stroke="#484f58" stroke-width="1"/>
<text x="784" y="471" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="700">suspend_entity = OFF</text>
<text x="784" y="485" text-anchor="middle" fill="#6e7681" font-size="9">re-evaluate motion + lux</text>

<!-- SENSOR CONFIG MATRIX -->
<rect x="20" y="530" width="240" height="120" rx="8" fill="#0c2033" stroke="#1f6feb" stroke-width="1"/>
<text x="140" y="550" text-anchor="middle" fill="#42a5f5" font-size="11" font-weight="700">Presence Signal Priority</text>
<text x="32" y="570" fill="#8b949e" font-size="9" font-weight="700">Motion + Occupancy:</text>
<text x="42" y="583" fill="#6e7681" font-size="9">ON: motion · OFF: occupancy</text>
<text x="32" y="600" fill="#8b949e" font-size="9" font-weight="700">Motion only:</text>
<text x="42" y="613" fill="#6e7681" font-size="9">ON: motion · OFF: motion timeout</text>
<text x="32" y="630" fill="#8b949e" font-size="9" font-weight="700">Occupancy only:</text>
<text x="42" y="643" fill="#6e7681" font-size="9">ON: occupancy · OFF: occupancy</text>

<!-- LEGEND -->
<rect x="20" y="800" width="1260" height="128" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="650" y="820" text-anchor="middle" fill="#6e7681" font-size="11" font-weight="700">LEGEND</text>
<line x1="40" y1="840" x2="76" y2="840" stroke="#66bb6a" stroke-width="2" marker-end="url(#ag)"/>
<text x="84" y="844" fill="#3fb950" font-size="11">Activate / Recover</text>
<line x1="220" y1="840" x2="256" y2="840" stroke="#f0883e" stroke-width="2" marker-end="url(#ao)"/>
<text x="264" y="844" fill="#f0883e" font-size="11">Warning dim → OFF</text>
<line x1="410" y1="840" x2="446" y2="840" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
<text x="454" y="844" fill="#f85149" font-size="11">Failsafe / Perm override</text>
<line x1="620" y1="840" x2="656" y2="840" stroke="#ab47bc" stroke-width="2" marker-end="url(#ap)"/>
<text x="664" y="844" fill="#d2a8ff" font-size="11">Temp override (whodidit)</text>
<line x1="840" y1="840" x2="876" y2="840" stroke="#42a5f5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
<text x="884" y="844" fill="#42a5f5" font-size="11">Natural light auto-off</text>
<line x1="1050" y1="840" x2="1086" y2="840" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ay)"/>
<text x="1094" y="844" fill="#8b949e" font-size="11">Suspend</text>

<text x="40" y="868" fill="#6e7681" font-size="10" font-weight="700">TIMERS:</text>
<text x="105" y="868" fill="#8b949e" font-size="10">occupancy_timeout · failsafe_timeout · warning_dim_duration · temp_override_timeout · perm_override_timeout</text>
<text x="40" y="884" fill="#6e7681" font-size="10" font-weight="700">LUX:</text>
<text x="80" y="884" fill="#8b949e" font-size="10">lux_threshold · lux_hysteresis_pct · lux_hysteresis_time    |    ADAPTIVE: adaptive_window · adaptive_threshold · adaptive_multiplier · adaptive_max_factor</text>
<text x="40" y="900" fill="#6e7681" font-size="10" font-weight="700">WHODIDIT:</text>
<text x="110" y="900" fill="#8b949e" font-size="10">binary_sensor ON→OFF, reads click_count attribute — 1 = temp_override (toggle + restart timer, exit only on timeout) · 2 = perm_override (toggle, enter/exit) · 3+ = ignored</text>
<text x="40" y="916" fill="#6e7681" font-size="10" font-weight="700">NOTE:</text>
<text x="86" y="916" fill="#8b949e" font-size="10">no_motion_timeout was removed in v4.3.0 — failsafe_timeout is the sole guard against a stuck occupancy sensor</text>
</svg>
